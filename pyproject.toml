[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "src"
version = "0.1.0"
description = "Persona-conditioned reinforcement learning on the Mario AI Framework."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "gymnasium",
    "numpy",
    "JPype1",
    "tyro",
    "imageio",
    "imageio-ffmpeg",
    "tensorboard",
    "tqdm",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
