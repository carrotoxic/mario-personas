# Shared PPO hyperparameters for the three personas (500M steps, 50k level pool).
total_timesteps: 500000000
learning_rate: 0.0005
num_envs: 16
num_steps: 512
anneal_lr: true
gamma: 0.99
gae_lambda: 0.95
num_minibatches: 4
update_epochs: 8
norm_adv: true
clip_coef: 0.1
clip_vloss: true
ent_coef: 0.0005
vf_coef: 0.95
max_grad_norm: 0.7
target_kl: 0.01
checkpoint_interval: 1000000
episode_log_interval: 10000
eval_holdout_interval: 10000000
eval_holdout_level_dir: data/human_experiment/levels/playable_test
eval_num_levels: 10
eval_num_iterations: 10
features_dim: 1024
embed_dim: 16
head_hidden_dim: 1024
level_dir: data/human_experiment/levels/playable_train
jar_path: main/smb/Mario-AI-Interface.jar
user_dir: main/smb
seconds: 200
mario_mode: 0
max_steps: 3000
frame_skip: 1
obs_shape: [16, 16]
lives: 0
max_id: 100
use_state_features: true
death_penalty: 0.0
completion_reward: 0.0
win_reward: 5.0
brick_reward: 0.0
segment_reward: 1.0
